name: Portfolio browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_LIVE_URL: https://jalak-patel-190.github.io/jalak-portfolio/
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Upload browser report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Lighthouse on the live homepage and company hubs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://jalak-patel-190.github.io/jalak-portfolio/
            https://jalak-patel-190.github.io/jalak-portfolio/case-studies/ajmera/
            https://jalak-patel-190.github.io/jalak-portfolio/case-studies/cinekorn/
            https://jalak-patel-190.github.io/jalak-portfolio/case-studies/jalan/
            https://jalak-patel-190.github.io/jalak-portfolio/case-studies/swad/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false
